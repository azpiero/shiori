[package]
name = "shiori"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kuchiki = "0.8"
url = "2"
percent-encoding = "2"
walkdir = "2"
unicode-normalization = "0.1"
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
